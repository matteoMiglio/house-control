# A Home Assistant with pretend devices, for testing House Control without hardware.
# Started by ../homeassistant.sh. The "demo" integration adds lights (dimmable, white,
# colour), thermostats / heat pumps and temperature sensors that answer like real ones.
homeassistant:
  name: House Control Lab
  unit_system: metric
  temperature_unit: C
  time_zone: UTC
  country: GB
  latitude: 51.5
  longitude: -0.12
  elevation: 10

http:
  server_port: 8123

api:
websocket_api:
frontend:
config:
zeroconf:

demo:

# Solar panels and a home battery, for a plan's energy section: sensors named and signed like
# those of Home Assistant's Fronius integration (a Symo GEN24 with a BYD battery). Move the
# sliders under Settings → Devices & services → Helpers (or call input_number.set_value) and
# the power flow in House Control follows. One more reports the panels in kW, as other
# integrations do.
input_number:
  lab_solar:
    name: Lab solar production
    min: 0
    max: 10000
    step: 10
    initial: 3200
    unit_of_measurement: W
  lab_house:
    name: Lab house consumption
    min: 0
    max: 10000
    step: 10
    initial: 850
    unit_of_measurement: W
  lab_battery:
    name: Lab battery (+ discharging, − charging)
    min: -5000
    max: 5000
    step: 10
    initial: -1500
    unit_of_measurement: W
  lab_charge:
    name: Lab battery charge
    min: 0
    max: 100
    step: 1
    initial: 64
    unit_of_measurement: "%"

template:
  - sensor:
      - name: SolarNet Power photovoltaics
        unique_id: lab_power_photovoltaics
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ states('input_number.lab_solar') | float(0) }}"
      - name: SolarNet Power load
        unique_id: lab_power_load
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        # Fronius counts what the house uses as negative.
        state: "{{ 0 - states('input_number.lab_house') | float(0) }}"
      - name: SolarNet Power battery
        unique_id: lab_power_battery
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ states('input_number.lab_battery') | float(0) }}"
      - name: SolarNet Power grid
        unique_id: lab_power_grid
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        # What the panels and the battery do not cover comes from the grid (negative: exported).
        state: >-
          {{ (states('input_number.lab_house') | float(0)) - (states('input_number.lab_solar') | float(0))
             - (states('input_number.lab_battery') | float(0)) }}
      - name: BYD Battery-Box Premium HV State of charge
        unique_id: lab_state_of_charge
        device_class: battery
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ states('input_number.lab_charge') | float(0) }}"
      - name: PV power
        unique_id: lab_pv_power_kw
        device_class: power
        state_class: measurement
        unit_of_measurement: kW
        state: "{{ (states('input_number.lab_solar') | float(0) / 1000) | round(3) }}"
